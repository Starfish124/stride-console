<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Console</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #F4F4F8; color: #101116; font-family: "Archivo", Helvetica, Arial, sans-serif; }
  main { max-width: 26rem; padding: 2rem; }
  .mark { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent;
          border-bottom: 32px solid #3D44D9; margin-bottom: 1.5rem; }
  h1 { font-weight: 800; letter-spacing: -0.02em; font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: #5E647B; font-size: .95rem; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>You are offline.</h1>
  <p>The console lives on your own machine and needs a connection to it. Reconnect and pull to refresh. Your drafts are safe where you left them.</p>
</main>
</body>
</html>
